<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF2">
<title>一物一价 · 物品平均花费</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<!-- iPhone 添加到主屏幕：全屏运行 + 独立图标与名字 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一物一价">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ===================================================
   一物一价 · 样式
   卡通贴纸风：粗描边 + 硬阴影 + 奶油底
   =================================================== */
:root{
  --cream:#FFFBF2;
  --paper:#FFFDF8;
  --ink:#2B2622;
  --ink-2:#6B625A;
  --ink-3:#A1978C;
  --line:#EADFCF;
  --orange:#FF8A5B;
  --orange-d:#F2733F;
  --teal:#4FB3A9;
  --yellow:#FFCB57;
  --pink:#FFB3C7;
  --danger:#E05B5B;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:11px;
  --edge:2px solid var(--ink);
  --pop:4px 4px 0 rgba(43,38,34,.13);
  --pop-sm:3px 3px 0 rgba(43,38,34,.13);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* 关掉双击缩放：连续点按钮不再触发页面放大（捏合缩放保留） */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit}
svg{flex:none}

/* ---------- 背景层 ---------- */
.bg-layer{
  position:fixed;inset:-24px;z-index:-2;
  background-color:var(--cream);
  background-image:radial-gradient(#EFE1CD 1.7px, transparent 1.7px);
  background-size:24px 24px;
  background-position:center;
  background-repeat:repeat;
  transition:filter .35s ease;
}
.bg-layer::after{
  content:"";position:absolute;inset:0;
  background:var(--fade, rgba(255,251,242,.42));
  transition:background .3s ease;
}
.bg-layer.has-photo{background-size:cover;background-repeat:no-repeat}

/* ---------- 布局 ---------- */
.app{
  max-width:1080px;margin:0 auto;padding:30px 20px 80px;
  /* iPhone 主屏全屏模式：避开刘海/状态栏与底部小横条 */
  padding-top:calc(30px + env(safe-area-inset-top));
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
/* 顶部的「上次更新」时间 */
/* 顶部今日日期时间 */
.now-bar{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  margin:0 0 16px;font-size:11.5px;font-weight:700;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.now-bar svg{width:13px;height:13px;flex:none;opacity:.75}
.now-bar b{color:var(--ink-2);font-weight:800;letter-spacing:.2px}
/* 展开区底部的「上次更新」 */
.upd-line{
  display:flex;align-items:center;gap:5px;justify-content:flex-end;
  margin-top:9px;padding-top:8px;border-top:1px dashed #F0E4D2;
  font-size:11px;font-weight:700;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.upd-line svg{width:12px;height:12px;flex:none;opacity:.7}
.upd-line b{color:var(--ink-2);font-weight:800}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{
  width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--yellow),var(--orange));
  border:var(--edge);box-shadow:var(--pop-sm);color:var(--ink);
}
.logo svg{width:23px;height:23px}
.topbar h1{font-size:22px;margin:0;letter-spacing:.5px}
.topbar p{margin:1px 0 0;font-size:12.5px;color:var(--ink-2)}
.top-actions{display:flex;gap:9px;flex:none}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:var(--edge);border-radius:var(--r-sm);
  background:var(--paper);color:var(--ink);
  font-size:14px;font-weight:700;letter-spacing:.2px;
  padding:9px 16px;cursor:pointer;
  box-shadow:var(--pop-sm);
  transition:transform .1s ease, box-shadow .1s ease, background .15s;
  user-select:none;white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn:hover{background:#fff}
.btn:active{transform:translate(3px,3px) scale(.97);box-shadow:0 0 0 rgba(0,0,0,0)}
.btn.primary{background:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-d)}
.btn.ghost{background:var(--paper)}
.btn.dashed{background:transparent;border-style:dashed;box-shadow:none;color:var(--ink-2)}
.btn.dashed:hover{color:var(--ink);border-color:var(--ink);background:#fff}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger);box-shadow:2px 2px 0 rgba(224,91,91,.2)}
.btn.sm{font-size:12.5px;padding:6px 11px;border-width:1.8px;border-radius:9px}
.btn.only-icon{padding:9px;width:40px;height:40px;border-radius:12px}
.btn.only-icon svg{width:17px;height:17px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}

/* ---------- 概览 ---------- */
.overview{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;
}
.stat{
  position:relative;
  background:var(--paper);border:var(--edge);border-radius:var(--r-md);
  padding:13px 15px;box-shadow:var(--pop-sm);
  display:flex;align-items:baseline;flex-wrap:wrap;gap:3px;
}
.stat .k{display:block;width:100%;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:2px}
.stat .v{display:flex;align-items:baseline;gap:3px;min-width:0;max-width:100%}
.stat b{font-size:25px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.accent{background:linear-gradient(140deg,#FFF0D9,#FFE3D2)}
.stat.accent b{color:var(--orange-d)}

/* 可点击的统计卡：右侧小箭头 + 展开态 */
.stat.click{
  font-family:inherit;text-align:left;cursor:pointer;color:inherit;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .18s ease;
}
.stat.click:hover{box-shadow:4px 4px 0 rgba(43,38,34,.16)}
.stat.click:active{transform:scale(.97)}
.stat.click.on{background:linear-gradient(140deg,#FFF6EA,#FFEADA)}
.stat .chev{
  position:absolute;top:10px;right:10px;width:13px;height:13px;color:var(--ink-3);
  transition:transform .34s cubic-bezier(.34,1.56,.64,1), color .2s;
}
.stat.click.on .chev{transform:rotate(180deg);color:var(--ink)}

/* 展开的明细面板 */
.stat-panel{
  overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);margin-bottom:0;
  transition:max-height .36s cubic-bezier(.22,.9,.25,1), opacity .24s ease,
             transform .3s cubic-bezier(.22,.9,.25,1), margin-bottom .3s ease;
}
.stat-panel.open{max-height:330px;opacity:1;transform:none;margin-bottom:14px}
.stat-panel-in{
  background:var(--paper);border:var(--edge);border-radius:var(--r-md);
  box-shadow:var(--pop-sm);padding:11px 13px 13px;
}
.sp-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sp-head h3{margin:0;font-size:13.5px;font-weight:800;letter-spacing:.2px}
.sp-sub{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-left:auto}
.sp-close{
  flex:none;width:26px;height:26px;display:grid;place-items:center;
  border:0;background:#F6EEE1;color:var(--ink-2);border-radius:8px;cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .15s;
}
.sp-close:hover{background:#EFE3D0;color:var(--ink)}
.sp-close:active{transform:scale(.86)}
.sp-close svg{width:12px;height:12px}
.sp-body{max-height:216px;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:#E3D6C2 transparent}
.sp-body::-webkit-scrollbar{width:6px}
.sp-body::-webkit-scrollbar-thumb{background:#E3D6C2;border-radius:3px}
.sp-swap{animation:spFade .26s ease}
@keyframes spFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sp-cell{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 4px;border-radius:12px;background:#FFFCF6;border:1.5px solid #F1E7D8;
}
.sp-cell b{font-size:11.5px;font-weight:700;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-thumb{width:34px;height:34px;border-radius:10px;font-size:17px}

.sp-list{display:flex;flex-direction:column}
.sp-row{
  display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid #F4ECDF;
}
.sp-row:last-child{border-bottom:0}
.sp-row b{flex:1;min-width:0;font-size:12.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-row em{font-style:normal;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.sp-share{flex:none;font-size:11px;font-weight:700;color:var(--ink-3)}
.sp-rank{
  flex:none;width:17px;height:17px;border-radius:6px;display:grid;place-items:center;
  font-size:10.5px;font-weight:800;background:#F3E8D6;color:var(--ink-2);
}
.sp-row:nth-child(1) .sp-rank{background:var(--yellow);color:#6B4A00}
.sp-empty{margin:2px 0 6px;font-size:12.5px;color:var(--ink-3)}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
  background:var(--paper);border:var(--edge);border-radius:var(--r-sm);
  padding:0 12px;box-shadow:var(--pop-sm);height:42px;
}
.search svg{width:16px;height:16px;color:var(--ink-3)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink);height:100%}
.search input::placeholder{color:var(--ink-3)}
.select{
  height:42px;border:var(--edge);border-radius:var(--r-sm);background:var(--paper);
  padding:0 12px;font-size:13.5px;font-weight:600;color:var(--ink);
  box-shadow:var(--pop-sm);cursor:pointer;outline:none;
}
.chips{display:flex;gap:6px}
.chip{
  border:1.8px solid var(--line);background:transparent;color:var(--ink-2);
  font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;
  transition:.15s;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- 卡片网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}

/* 视图切换 */
.view-toggle{
  display:flex;gap:0;border:var(--edge);border-radius:var(--r-sm);
  background:var(--paper);box-shadow:var(--pop-sm);overflow:hidden;height:42px;
}
.view-toggle button{
  border:0;background:transparent;cursor:pointer;width:44px;color:var(--ink-3);
  display:grid;place-items:center;transition:.15s;
}
.view-toggle button+button{border-left:1.5px solid var(--line)}
.view-toggle button svg{width:17px;height:17px}
.view-toggle button:hover{color:var(--ink)}
.view-toggle button.on{background:var(--ink);color:#fff}

/* 排序方向按钮 */
.dir-btn{
  display:flex;align-items:center;gap:5px;height:42px;
  border:var(--edge);border-radius:var(--r-sm);background:var(--paper);
  box-shadow:var(--pop-sm);padding:0 11px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);
}
.dir-btn svg{width:15px;height:15px;transition:transform .18s}
.dir-btn.asc svg{transform:rotate(180deg)}
.dir-btn i{font-style:normal;color:var(--ink-2);font-weight:600;white-space:nowrap}
.dir-btn.disabled{opacity:.5}
.dir-btn:hover{border-color:var(--ink-3)}

/* 拖拽手柄与拖动状态 */
.drag-handle{
  flex:none;display:grid;place-items:center;width:26px;height:30px;
  color:var(--ink-3);cursor:grab;touch-action:none;border-radius:7px;
}
.drag-handle:hover{color:var(--ink);background:#F4EDE1}
.drag-handle svg{width:17px;height:17px;pointer-events:none}
.dragging{
  z-index:50;pointer-events:none;opacity:.96;
  box-shadow:0 16px 30px -12px rgba(43,38,34,.5) !important;
  transform:scale(1.02);
  will-change:transform;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  cursor:grabbing;
}
/* 拖动时卡片跟随手，取消 hover 位移，免得影响位置计算 */
.grid.is-dragging .card:hover,
.grid.is-dragging .crow:hover{transform:none;box-shadow:var(--pop)}
/* 落点占位槽 */
.drag-ph{
  border:2px dashed #F0A277;border-radius:var(--r-lg);
  background:repeating-linear-gradient(135deg,rgba(255,138,91,.13) 0 8px,rgba(255,138,91,.05) 8px 16px);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);
  pointer-events:none;
  animation:slotIn .18s ease-out;
}
.grid.compact .drag-ph{border-radius:var(--r-md)}
@keyframes slotIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---------- 紧凑列表视图 ---------- */
.grid.compact{display:flex;flex-direction:column;gap:9px}
.crow{
  background:var(--paper);border:var(--edge);border-radius:var(--r-md);
  box-shadow:var(--pop-sm);overflow:hidden;
}
.crow-main{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 12px;border:0;background:transparent;cursor:pointer;
  font-family:inherit;text-align:left;position:relative;
}
.crow-main:active{background:#FBF3E6;transform:scale(.99)}
.thumb.sm{width:38px;height:38px;border-radius:11px;font-size:19px}
.crow-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.crow-info b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow-info i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.crow-cost{display:flex;align-items:baseline;gap:2px;flex:none}
.crow-cost em{font-style:normal;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums}
.crow-cost i{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:600}
.quick-pill{
  flex:none;border:var(--edge);background:#DEF3EF;border-radius:999px;
  font-size:12px;font-weight:800;padding:4px 10px;color:#0E7A66;cursor:pointer;
  box-shadow:2px 2px 0 rgba(43,38,34,.14);
}
.quick-pill:active{transform:translate(1px,1px);box-shadow:none}
.dot-today{
  flex:none;width:9px;height:9px;border-radius:50%;background:var(--orange);
  border:1.5px solid var(--ink);position:absolute;top:7px;right:7px;
}
.crow-body{border-top:1.5px dashed var(--line);padding:4px 12px 10px;animation:drop .22s ease}
/* 展开后的购入价 / 购入日期 */
.crow-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:linear-gradient(120deg,#FFF8EC,#FFFCF6);
  border:1.5px dashed #EFDCC0;border-radius:11px;
  padding:8px 12px;margin:6px 0 9px;
}
.crow-meta span{display:inline-flex;align-items:baseline;gap:6px;min-width:0}
.crow-meta i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.crow-meta b{font-size:13.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.crow-meta .cm-price b{font-size:16px;color:var(--orange-d);letter-spacing:-.3px}
.crow-tools{display:flex;gap:6px;margin-top:7px}
.crow-tools .m-act{border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff}

/* 备份弹窗 */
.bak-section{border-top:1.5px dashed var(--line);margin-top:14px;padding-top:12px}
.bak-section h3{margin:0 0 4px;font-size:14px}
.backup-list{margin-top:8px;display:flex;flex-direction:column;gap:5px;max-height:180px;overflow-y:auto}
.bak-item{
  display:flex;align-items:center;gap:8px;font-size:12.5px;
  border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;
}
.bak-time{flex:1;font-variant-numeric:tabular-nums;font-weight:600}
.bak-count{color:var(--ink-3);font-size:11.5px}
.switch-row{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;cursor:pointer;margin:6px 0 10px}
.switch-row input{width:18px;height:18px;accent-color:var(--orange)}

.card{
  background:var(--paper);border:var(--edge);border-radius:var(--r-lg);
  box-shadow:var(--pop);padding:16px;position:relative;
  display:flex;flex-direction:column;gap:12px;
  transition:transform .16s ease, box-shadow .16s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:6px 6px 0 rgba(43,38,34,.15)}
.card .card-top{display:flex;align-items:center;gap:11px}
.thumb{
  width:52px;height:52px;border-radius:15px;flex:none;overflow:hidden;
  border:var(--edge);background:linear-gradient(140deg,#FFF3E0,#FFE8D2);
  display:grid;place-items:center;font-size:25px;line-height:1;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0}
.meta h3{font-size:15.5px;margin:0;font-weight:800;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tools{display:flex;gap:4px;flex:none}
.icon-btn{
  width:29px;height:29px;display:grid;place-items:center;border-radius:9px;
  border:0;background:transparent;color:var(--ink-3);cursor:pointer;transition:.15s;
}
.icon-btn:hover{background:#F4EDE1;color:var(--ink)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.del:hover{background:#FDECEC;color:var(--danger)}

.price-block{
  background:linear-gradient(140deg,#FFF8EC,#FFF1E2);
  border:1.8px dashed #E8D6BC;border-radius:var(--r-md);
  padding:12px 14px;position:relative;overflow:hidden;
}
.price-block .per-line{display:flex;align-items:baseline;gap:2px;color:var(--ink)}
.price-block .cur{font-size:16px;font-weight:800;color:var(--orange-d)}
.price-block .big{font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.price-block .per{font-size:13px;font-weight:700;color:var(--orange-d);margin-left:3px}
.price-block .desc{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.price-block .badge{
  position:absolute;top:9px;right:10px;font-size:10px;font-weight:700;
  background:var(--teal);color:#fff;border-radius:999px;padding:2px 8px;letter-spacing:.3px;
}
.price-block .badge.manual{background:#B9A794}

.spark{width:100%;height:34px;display:block;margin:-4px 0 -2px}
.spark polyline{fill:none;stroke:var(--orange);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.spark .fill{fill:rgba(255,138,91,.13);stroke:none}
.spark .axis{stroke:#E8DCC8;stroke-width:1;stroke-dasharray:3 3}

.card-foot{display:flex;gap:8px;margin-top:auto}
.card-foot .btn{flex:1;font-size:13px;padding:8px 10px}

/* 今日数据已更新提示 */
.day-tip{
  display:flex;align-items:center;gap:7px;
  background:#FFF5E8;border:1.6px dashed #EFC38F;border-radius:12px;
  padding:7px 10px;font-size:11.5px;font-weight:700;color:#A85F1C;
  animation:tipIn .26s cubic-bezier(.2,1.3,.5,1);
}
@keyframes tipIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.day-tip .tip-dot{
  width:6px;height:6px;border-radius:50%;background:#F2994A;flex:none;
  box-shadow:0 0 0 3px rgba(242,153,74,.20);
}
.day-tip button{
  margin-left:auto;flex:none;cursor:pointer;font-family:inherit;
  border:1.5px solid #E4B078;background:#fff;color:#96520F;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;
  transition:.14s;
}
.day-tip button:hover{background:#FFFAF2;border-color:#C4843B;color:#7A3F06}
.count-hint{font-size:11.5px;color:var(--ink-3);text-align:right;padding-right:2px}

/* ---------- 展开的计算方式 ---------- */
.metrics-panel{display:none;border-top:1.8px dashed var(--line);padding-top:11px;margin-top:-2px}
.metrics-panel.open{display:block;animation:drop .2s ease}
@keyframes drop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.m-row{
  display:flex;align-items:center;gap:8px;padding:7px 0;
  border-bottom:1px solid #F3EADD;
}
.m-row.col{flex-direction:column;align-items:stretch;gap:7px;padding:9px 0}
.m-row:last-child{border-bottom:0}
.m-line{display:flex;align-items:center;gap:8px;width:100%}
.m-label{font-size:12.5px;font-weight:700;flex:none;min-width:52px}
.m-cost{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:1}
.m-cost b{color:var(--ink);font-size:13.5px}
.m-sub{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.m-unit{font-size:11.5px;color:var(--ink-3);font-weight:600;flex:none}
.m-tag{
  font-size:10.5px;font-weight:700;color:#2A7F76;background:rgba(79,179,169,.14);
  padding:2px 8px;border-radius:999px;flex:none;
}
.m-edit{
  width:74px;height:28px;border:1.6px solid var(--line);border-radius:8px;
  background:#fff;text-align:right;padding:0 7px;font-size:12.5px;font-weight:700;
  color:var(--ink);outline:none;font-variant-numeric:tabular-nums;font-family:inherit;
}
.m-edit.wide{width:auto;flex:1;text-align:center}
.m-edit:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,91,.14)}
.m-act{
  border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  font-size:11.5px;font-weight:700;padding:4px 5px;border-radius:7px;flex:none;
}
.m-act:hover{background:#F4EDE1;color:var(--ink)}
.m-act:disabled{opacity:.35;cursor:not-allowed;background:transparent}

/* +1 / -1 步进按钮 */
.step{
  width:32px;height:32px;flex:none;padding:0;
  border:1.8px solid var(--line);border-radius:10px;background:#fff;
  font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1;
  box-shadow:1.5px 1.5px 0 rgba(43,38,34,.09);
  transition:transform .08s, box-shadow .08s, background .15s, border-color .15s;
  font-family:inherit;
}
.step:hover{background:#FFF6E7;border-color:var(--orange);color:var(--orange-d)}
.step:active{transform:translate(1.5px,1.5px);box-shadow:none}

/* 卡片上的快捷 +1 */
.btn.quick{
  flex:0 0 auto;padding:8px 14px;background:#EAF7F4;border-color:#7FC9C1;
  color:#25746C;font-size:13px;box-shadow:2px 2px 0 rgba(79,179,169,.25);
}
.btn.quick:hover{background:#DEF3EF;border-color:var(--teal)}

/* ---------- 空状态 ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--ink-2)}
.empty svg{width:118px;height:auto;color:var(--ink-3);opacity:.75}
.empty h3{margin:14px 0 4px;font-size:17px;color:var(--ink)}
.empty p{margin:0 0 18px;font-size:13.5px;color:var(--ink-2)}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(43,38,34,.42);backdrop-filter:blur(3px)}
.sheet{
  position:relative;width:100%;max-width:600px;max-height:88vh;overflow:hidden;
  background:var(--paper);border:var(--edge);border-radius:var(--r-lg);
  box-shadow:7px 7px 0 rgba(43,38,34,.22);
  display:flex;flex-direction:column;animation:popIn .22s cubic-bezier(.2,1.3,.5,1);
}
.sheet.narrow{max-width:420px}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;border-bottom:1.8px solid var(--line);
}
.sheet-head h2{margin:0;font-size:17px}
.sheet-body{padding:18px;overflow-y:auto}
.sheet-foot{
  display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;
  border-top:1.8px solid var(--line);background:#FFF9F0;
}

.form-grid{display:grid;grid-template-columns:132px 1fr;gap:16px}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}

.thumb-edit{display:flex;flex-direction:column;gap:8px;align-items:center}
.thumb-preview{
  width:112px;height:112px;border-radius:20px;border:var(--edge);
  background:linear-gradient(140deg,#FFF3E0,#FFE8D2);
  display:grid;place-items:center;font-size:44px;overflow:hidden;box-shadow:var(--pop-sm);
}
.thumb-preview img{width:100%;height:100%;object-fit:cover}
.thumb-tools{display:flex;gap:5px}
.thumb-tools .btn{padding:5px 9px;font-size:11.5px}
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:140px}
.emoji-row button{
  width:27px;height:27px;border-radius:8px;border:1.6px solid transparent;
  background:#FFF6E7;cursor:pointer;font-size:14px;line-height:1;padding:0;
  display:grid;place-items:center;transition:.13s;
}
.emoji-row button:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.emoji-row button.on{border-color:var(--orange);background:#FFEEDF}

.fields{display:flex;flex-direction:column;gap:12px}
.field{display:block}
.field span{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.select.wide{
  width:100%;height:42px;border:1.8px solid var(--line);border-radius:var(--r-sm);
  background:#fff;padding:0 11px;font-size:14px;color:var(--ink);outline:none;
  transition:.15s;font-family:inherit;
}
.field input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,91,.16)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.section{margin-top:20px;padding-top:16px;border-top:1.8px dashed var(--line)}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.section-head h3{margin:0 0 2px;font-size:14px}
.section-head p{margin:0;font-size:12px;color:var(--ink-3)}

.metric-rows{display:flex;flex-direction:column;gap:9px;margin-bottom:11px}
.metric-form{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  background:#FFFDF9;border:1.6px solid var(--line);border-radius:12px;padding:9px 10px;
}
.metric-form .kind{
  height:34px;border:1.6px solid var(--line);border-radius:9px;background:#fff;
  font-size:12.5px;font-weight:700;padding:0 8px;outline:none;cursor:pointer;color:var(--ink);
}
.metric-form .unit-in{
  width:66px;height:34px;border:1.6px solid var(--line);border-radius:9px;background:#fff;
  font-size:12.5px;padding:0 8px;outline:none;color:var(--ink);font-family:inherit;
  transition:border-color .18s, box-shadow .18s, background .18s;
}
/* 自定义算法的「名称」框：更宽一点，好点、好认 */
.metric-form .unit-in.name-in{width:104px;background:#FFFCF4}
.metric-form .unit-in:focus{
  border-color:var(--orange);background:#fff;
  box-shadow:0 0 0 3px rgba(232,138,60,.16);
}
.metric-form .unit-in::placeholder{color:#B9AE9C;font-weight:600}
/* 刚切到「自定义」时，轻轻提示这里要填名字 */
.metric-form .unit-in.need-name{animation:needName 1.1s ease-out 2;border-color:#EFC38F}
@keyframes needName{
  0%,100%{box-shadow:0 0 0 0 rgba(232,138,60,0)}
  45%{box-shadow:0 0 0 4px rgba(232,138,60,.22);border-color:var(--orange)}
}
.metric-form .val-in{
  width:82px;height:34px;border:1.6px solid var(--line);border-radius:9px;background:#fff;
  font-size:12.5px;font-weight:700;padding:0 8px;outline:none;text-align:right;color:var(--ink);
  font-family:inherit;font-variant-numeric:tabular-nums;
}
.metric-form .primary-pick{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  color:var(--ink-2);cursor:pointer;padding:4px 7px;border-radius:8px;background:#F6EEE1;
}
.metric-form .primary-pick input{accent-color:var(--orange);margin:0;width:14px;height:14px}
.metric-form .grow{flex:1}
.metric-form .rm{
  width:28px;height:28px;border:0;background:transparent;color:var(--ink-3);
  cursor:pointer;border-radius:7px;display:grid;place-items:center;
}
.metric-form .rm:hover{background:#FDECEC;color:var(--danger)}
.metric-form .hint-inline{font-size:11.5px;color:var(--ink-3)}

/* ---------- 背景面板 ---------- */
.bg-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.bg-presets button{
  height:62px;border-radius:13px;border:var(--edge);cursor:pointer;position:relative;
  box-shadow:var(--pop-sm);transition:.14s;overflow:hidden;
}
.bg-presets button:hover{transform:translateY(-2px)}
.bg-presets button.on::after{
  content:"✓";position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(43,38,34,.42);color:#fff;font-size:19px;font-weight:800;
}
.slider-row{display:flex;align-items:center;gap:10px;margin-top:13px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.slider-row input[type=range]{flex:1;accent-color:var(--orange)}
.slider-row b{width:26px;text-align:right;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.6}
.vert{display:flex;flex-direction:column;gap:9px}

/* ---------- 数字键盘 ---------- */
.numkbd{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:var(--cream);
  border-top:2px solid var(--ink);
  box-shadow:0 -10px 26px -14px rgba(43,38,34,.45);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  transform:translateY(112%);
  transition:transform .3s cubic-bezier(.22,.9,.25,1);
  will-change:transform;
  touch-action:manipulation;
  user-select:none;
}
.numkbd.show{transform:translateY(0)}
.nk-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding:0 2px}
.nk-title{font-size:12px;font-weight:700;color:var(--ink-2);flex:none}
.nk-val{
  flex:1;text-align:right;font-size:20px;font-weight:800;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nk-done{
  flex:none;border:var(--edge);border-radius:10px;background:var(--orange);color:#fff;
  font-family:inherit;font-size:13px;font-weight:800;padding:7px 16px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(43,38,34,.2);
  transition:transform .1s ease, box-shadow .1s ease, background .15s;
  -webkit-tap-highlight-color:transparent;
}
.nk-done:active{transform:translate(2px,2px);box-shadow:none;background:var(--orange-d)}
.nk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nk-grid button{
  height:50px;border:var(--edge);border-radius:13px;background:var(--paper);
  font-family:inherit;font-size:21px;font-weight:800;color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 rgba(43,38,34,.16);
  transition:transform .07s ease, box-shadow .07s ease, background .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.nk-grid button:active{transform:translateY(3px);box-shadow:none;background:#FFF3E4}
.nk-grid button.nk-dot{font-size:24px;line-height:1}
.nk-grid button.nk-back{display:grid;place-items:center;background:#F6EEE1}
.nk-grid button.nk-back svg{width:20px;height:20px}
.nk-grid button.nk-back:active{background:#EFE3D0}
/* 正在编辑的输入框高亮 */
input.num-in-active{
  border-color:var(--orange)!important;
  box-shadow:0 0 0 3px rgba(255,138,91,.18)!important;
  background:#fff;
}
/* 键盘（系统 / 自定义）弹起时：弹窗收缩到键盘上方，输入框始终露在键盘之上 */
:root{--kbd-h:0px}
body.kbd-active .modal{padding-bottom:calc(var(--kbd-h) + 14px)}
body.kbd-active .modal .sheet{max-height:calc(100vh - var(--kbd-h) - 34px)}
body.kbd-active .modal .sheet-body{overscroll-behavior:contain}
/* 卡片里编辑数值时，页面也要能多滚一点，避免输入框落在键盘后面 */
body.kbd-active:not(.has-modal){padding-bottom:calc(var(--kbd-h) + 24px)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
  padding:11px 19px;border-radius:13px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.25s ease;z-index:99;max-width:86vw;
  border:2px solid var(--ink);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);border-color:#B33F3F}

/* ---------- 通用点击反馈 ---------- */
/* 所有可点元素统一：按下回弹 + 松开弹回（带一点点过冲，像贴纸被按下去） */
.chip,.dir-btn,.view-toggle button,.icon-btn,.m-act,.step,.quick-pill,
.day-tip button,.bg-presets button,.emoji-row button,.metric-form .rm,
.crow-main,.drag-handle,.select,.switch-row,.bak-item .m-act,.crow-tools .m-act{
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background-color .15s ease,
             border-color .15s ease, color .15s ease, box-shadow .12s ease;
}
.chip:active,.dir-btn:active,.view-toggle button:active,.icon-btn:active,
.m-act:active:not(:disabled),.step:active,.quick-pill:active,.day-tip button:active,
.bg-presets button:active,.emoji-row button:active,.metric-form .rm:active,
.crow-tools .m-act:active,.bak-item .m-act:active{
  transform:scale(.9);
  filter:brightness(.97);
}
.drag-handle:active{transform:scale(.88);background:#F4EDE1}
.select:active{border-color:var(--ink)}
.quick-pill:active,.step:active{box-shadow:0 0 0 rgba(0,0,0,0)}
.switch-row:active{transform:scale(.985)}
/* 点完会重渲染的按钮：用脉冲代替 :active */
.pulse{animation:pulsePop .52s cubic-bezier(.2,1.2,.35,1)}
@keyframes pulsePop{
  0%{transform:scale(1)}
  35%{transform:scale(1.05);filter:brightness(1.05)}
  100%{transform:scale(1)}
}

/* ---------- 触摸设备：输入框字号抬到 16px ---------- */
/* iOS Safari 聚焦字号 <16px 的输入框时会自动放大整页，看起来像「点一下界面就放大了」 */
@media (hover:none) and (pointer:coarse){
  input,select,textarea{font-size:16px !important}
  .m-edit{height:30px}
  .metric-form .kind{height:36px}
  .metric-form .unit-in,.metric-form .val-in{height:36px}
  .metric-form .unit-in{width:70px}
  .metric-form .unit-in.name-in{width:118px}
  .metric-form .val-in{width:92px}
  .search input{font-size:16px !important}
}

/* ---------- 响应式 ---------- */
@media(max-width:720px){
  .app{padding:20px 14px 64px}
  .overview{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat b{font-size:21px}
  .topbar{flex-wrap:wrap;gap:10px}
  .topbar h1{font-size:19px}
  .topbar p{font-size:11.5px}
  .grid{grid-template-columns:1fr;gap:13px}
  .toolbar{gap:8px}
  .select{flex:1;min-width:150px}
  .chips{width:100%;order:3}
  .chip{flex:1;text-align:center}
  .sheet{max-height:92vh}
  .sheet-body{padding:15px}
  .bg-presets{grid-template-columns:repeat(3,1fr)}
}

/* 关掉动效偏好时，只保留必要的变化 */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

</style>
</head>
<body>
<div id="bgLayer" class="bg-layer"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h18l-1.6 12.2a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8L3 7Z"/>
          <path d="M8.5 7V5.5a3.5 3.5 0 0 1 7 0V7"/>
        </svg>
      </div>
      <div>
        <h1>一物一价</h1>
        <p>算算每件东西，每天花掉你多少钱</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn ghost only-icon" id="btnBg" title="更换背景">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m4 17 5-4.5 3.5 3 3-2.5L20 17"/>
        </svg>
      </button>
      <button class="btn ghost only-icon" id="btnData" title="数据备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/>
        </svg>
      </button>
      <button class="btn primary" id="btnAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        添加物品
      </button>
    </div>
  </header>

  <div class="now-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
    </svg>
    <span>今天</span>
    <b id="nowClock">—</b>
  </div>

  <section class="overview">
    <button class="stat click" id="statItems" data-sp="items" aria-expanded="false" aria-controls="statPanel">
      <span class="k">在册物品</span>
      <span class="v"><b id="statCount">0</b><i>件</i></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="stat click" id="statCost" data-sp="cost" aria-expanded="false" aria-controls="statPanel">
      <span class="k">累计投入</span>
      <span class="v"><b id="statTotal">0</b><i>元</i></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="stat accent">
      <span class="k">每天总花销</span>
      <span class="v"><b id="statDaily">0</b><i>元 / 天</i></span>
    </div>
    <button class="stat click" id="statTop" data-sp="top" aria-expanded="false" aria-controls="statPanel">
      <span class="k">最贵单品</span>
      <span class="v"><b id="statTopPrice">0</b><i id="statTopName">暂无</i></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </section>

  <div class="stat-panel" id="statPanel">
    <div class="stat-panel-in">
      <div class="sp-head">
        <h3 id="spTitle">在册物品</h3>
        <span class="sp-sub" id="spSub"></span>
        <button class="sp-close" id="spClose" type="button" aria-label="收起">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sp-body" id="spBody"></div>
    </div>
  </div>


  <div class="toolbar">

<script>
/* ===================================================
   一物一价 · 逻辑
   数据：localStorage（物品）+ IndexedDB（图片）
   =================================================== */
(() => {
'use strict';

const STORE_KEY = 'yiwu.v2';
const LEGACY_KEY = 'yiwu.v1';
const DB_NAME = 'yiwu-img';
/** 内置示例的特征指纹，用于清掉旧版本自动塞进去的假数据 */
const DEMO_SIGS = ['吹风机|730', '小汽车|158000', '跑鞋|899', '咖啡机|1280', '手机|5999'];
const isDemoItem = i => i && (i.demo === true || DEMO_SIGS.includes(`${i.name}|${i.price}`));
const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);

const KINDS = {
  days:   { label: '按天',   unit: '天',   auto: true,  hint: '买下那天起，每天自动重算' },
  km:     { label: '按里程', unit: '公里', auto: false, hint: '更新表显里程' },
  times:  { label: '按次数', unit: '次',   auto: false, hint: '更新用过的次数' },
  custom: { label: '自定义', unit: '单位', auto: false, hint: '按瓶 / 按页 / 按次…' }
};

const EMOJIS = ['📦','💨','📱','💻','🚗','🚲','👟','🎧','☕','🍳','🧺','🛏️',
                '🪑','💡','⌚','🎮','📷','🪥','🧴','🍶','🎒','🔧'];

const BG_PRESETS = [
  { id:'cream', name:'奶油点点', color:'#FFFBF2',
    image:'radial-gradient(#EFE1CD 1.7px, transparent 1.7px)', size:'24px 24px', pos:'center' },
  { id:'mint',  name:'薄荷格纹', color:'#FBFEFD',
    image:'linear-gradient(45deg,#E4F5F1 25%,transparent 25%,transparent 75%,#E4F5F1 75%),linear-gradient(45deg,#E4F5F1 25%,transparent 25%,transparent 75%,#E4F5F1 75%)',
    size:'26px 26px', pos:'0 0,13px 13px' },
  { id:'peach', name:'蜜桃渐层', color:'#FFF8F1',
    image:'radial-gradient(900px 520px at 10% -12%, #FFDFCB, transparent 62%),radial-gradient(820px 480px at 94% 6%, #FFE9C6, transparent 58%)',
    size:'auto', pos:'center' },
  { id:'sky',   name:'晴空细雨', color:'#F7FBFF',
    image:'radial-gradient(#DDEBFB 2px, transparent 2px)', size:'28px 28px', pos:'center' },
  { id:'candy', name:'糖果圆点', color:'#FFFBFA',
    image:'radial-gradient(circle at 32% 32%, #FFE2EB 25%, transparent 26%),radial-gradient(circle at 72% 72%, #FFF1C7 25%, transparent 26%)',
    size:'34px 34px', pos:'center' },
  { id:'plain', name:'极简米白', color:'#FBF7EF', image:'none', size:'auto', pos:'center' }
];

/* ---------------- 状态 ---------------- */
let state = {
  items: [],
  bg: { mode: 'preset', preset: 'cream', blur: 0, fade: 42, rev: 0 },
  sort: 'cost',
  filter: 'all',
  q: '',
  view: 'card',
  dir: 'desc',
  autobak: { file: false },
  updatedAt: 0            // 数据最后一次修改的时间
};
const openPanels = new Set();
const urlCache = new Map();
let statOpen = null;      // 概览里当前展开的面板：items / cost / top
let editingId = null;
let pendingBlob = null;   // 本次编辑新选的图片
let pendingEmoji = '📦';

/* ---------------- 小工具 ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtMoney(v) {
  if (v == null || !isFinite(v)) return '—';
  if (v >= 0.01) return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (v > 0) return '<0.01';
  return '0.00';
}
function fmtNum(v) {
  const n = Number(v) || 0;
  return n.toLocaleString('zh-CN', { maximumFractionDigits: 1 });
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
/** 购买至今的天数（购买当天算第 1 天；当天买记 1 天避免除零） */
function useDays(buyDate) {
  const b = new Date(`${buyDate}T00:00:00`);
  if (isNaN(b)) return 1;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.max(1, Math.floor((t - b) / 86400000) + 1);
}
/** 年-月-日 时:分:秒 */
function fmtDateTime(ts) {
  const d = new Date(ts);
  if (!ts || isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
/** 数据内容有变动时盖个时间戳（切视图、排序方向这类不算） */
function markUpdated() {
  state.updatedAt = Date.now();
}
/** 记录「这件物品」最后一次内容变动 */
function touchItem(item) {
  if (item) item.updatedAt = Date.now();
}
/**
 * 单件物品的上次更新时间：只看真正被改过的记录。
 * 「按天」是自动算法、每天都在变，不算更新，否则其他手动算法的更新时间就永远看不到了。
 */
function itemUpdatedAt(item) {
  let ts = Number(item.updatedAt) || 0;
  for (const m of item.metrics || []) {
    if (m.kind === 'days') continue;
    ts = Math.max(ts, Number(m.updatedAt) || 0);
  }
  return ts;
}
/** 展开区里的「上次更新」：今天 14:32 / 昨天 / 3 天前 / 2025-03-05 */
function fmtRelDate(ts) {
  if (!ts) return '暂无记录';
  const d = new Date(ts);
  if (isNaN(d)) return '暂无记录';
  const a = new Date(ts); a.setHours(0, 0, 0, 0);
  const b = new Date(); b.setHours(0, 0, 0, 0);
  const diff = Math.round((b - a) / 86400000);
  const p = n => String(n).padStart(2, '0');
  if (diff <= 0) return `今天 ${p(d.getHours())}:${p(d.getMinutes())}`;
  if (diff === 1) return '昨天';
  if (diff <= 6) return `${diff} 天前`;
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
/** 展开区底部：上次更新时间 */
function updatedLineHtml(item) {
  const ts = itemUpdatedAt(item);
  const onlyDays = (item.metrics || []).length && item.metrics.every(m => m.kind === 'days');
  const text = ts ? fmtRelDate(ts) : (onlyDays ? '仅按天计算' : '暂无记录');
  const full = ts ? fmtDateTime(ts) : '';
  return `<div class="upd-line"${full ? ` title="上次更新：${full}"` : ''}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span>上次更新</span>
    <b>${esc(text)}</b>
  </div>`;
}
/** 顶部今日日期时间，每秒走一格 */
function tickClock() {
  const el = $('#nowClock');
  if (el) el.textContent = fmtDateTime(Date.now());
}
tickClock();
setInterval(tickClock, 1000);

function daysAgoText(ts) {
  if (!ts) return '从未更新';
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d <= 0) return '今天更新';
  if (d === 1) return '昨天更新';
  return `${d} 天前更新`;
}

/* ---------------- 存储 ---------------- */
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      items: state.items, bg: state.bg,
      sort: state.sort, filter: state.filter, q: state.q,
      view: state.view, dir: state.dir, autobak: state.autobak,
      updatedAt: state.updatedAt
    }));
  } catch (e) {
    toast('保存失败：浏览器存储空间可能已满', true);
  }
  pushSnapshot();
  scheduleFileBackup();
}
function load() {
  try {
    let raw = localStorage.getItem(STORE_KEY);

    // 首次运行新版本：把旧数据迁移过来，并剔除当时自动塞入的示例物品
    if (!raw) {
      const old = localStorage.getItem(LEGACY_KEY);
      if (!old) return false;
      const d = JSON.parse(old);
      if (Array.isArray(d.items)) d.items = d.items.filter(i => !isDemoItem(i));
      localStorage.setItem(STORE_KEY, JSON.stringify(d));
      localStorage.removeItem(LEGACY_KEY);
      raw = JSON.stringify(d);
    }

    const d = JSON.parse(raw);
    if (Array.isArray(d.items)) state.items = d.items;
    if (d.bg) state.bg = { ...state.bg, ...d.bg };
    if (d.sort) state.sort = d.sort;
    if (d.filter) state.filter = d.filter;
    if (d.q) state.q = d.q;
    if (d.view) state.view = d.view;
    if (d.dir) state.dir = d.dir;
    if (d.autobak) state.autobak = { ...state.autobak, ...d.autobak };
    state.updatedAt = Number(d.updatedAt) || 0;
    return true;
  } catch (e) { return false; }
}

/* ---------------- IndexedDB（图片） ---------------- */
function db() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('img');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function imgPut(key, blob) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('img', 'readwrite');
    tx.objectStore('img').put(blob, key);
    tx.oncomplete = () => { d.close(); res(); };
    tx.onerror = () => { d.close(); rej(tx.error); };
  });
}
async function imgGet(key) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('img', 'readonly');
    const r = tx.objectStore('img').get(key);
    r.onsuccess = () => { d.close(); res(r.result || null); };
    r.onerror = () => { d.close(); rej(r.error); };
  });
}
async function imgDel(key) {
  const d = await db();
  return new Promise((res) => {
    const tx = d.transaction('img', 'readwrite');
    tx.objectStore('img').delete(key);
    tx.oncomplete = () => { d.close(); res(); };
  });
}
async function imageUrl(key) {
  if (!key) return null;
  if (urlCache.has(key)) return urlCache.get(key);
  try {
    const blob = await imgGet(key);
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    urlCache.set(key, url);
    return url;
  } catch (e) { return null; }
}

/* ---------------- 计算 ---------------- */
function primaryMetric(item) {
  const ms = item.metrics || [];
  return ms.find(m => m.id === item.primaryId) || ms[0] || null;
}
/** 卡片上「主显示」用哪个算法：跟随顶部筛选（按天 / 按用量）；「全部」时用你设定的主口径 */
function displayMetric(item) {
  const ms = item.metrics || [];
  const p = primaryMetric(item);
  if (state.filter === 'days') return ms.find(m => m.kind === 'days') || p;
  if (state.filter === 'manual') {
    if (p && p.kind !== 'days') return p;          // 主口径本来就算用量，保持不变
    return ms.find(m => m.kind !== 'days') || p;   // 否则挑一个按用量的算法来显示
  }
  return p;
}
function metricValue(item, m) {
  return m.kind === 'days' ? useDays(item.buyDate) : Number(m.value) || 0;
}
function metricCost(item, m) {
  const v = metricValue(item, m);
  if (!v) return null;
  return item.price / v;
}
function unitOf(m) {
  return m.unit || KINDS[m.kind]?.unit || '次';
}
function isAuto(item) {
  return item.metrics.some(m => m.kind === 'days');
}
function undoDepth(item) {
  return (item.undo || []).length;
}

/** 更新一个手动计算方式的总量，并把旧值压进撤销栈 */
function applyValue(item, metricId, rawValue) {
  const m = item.metrics.find(x => x.id === metricId);
  if (!m || m.kind === 'days') return;
  const v = Math.max(0, Number(rawValue) || 0);
  if (v === (Number(m.value) || 0)) return;
  markDay(item);
  item.undo = item.undo || [];
  item.undo.push({
    at: Date.now(),
    updatedAt: Number(item.updatedAt) || 0,
    values: item.metrics.map(x => ({ id: x.id, value: x.value, updatedAt: Number(x.updatedAt) || 0 }))
  });
  if (item.undo.length > 30) item.undo.shift();
  m.value = v;
  m.updatedAt = Date.now();
  touchItem(item);
  const back = syncDayFlag(item);
  markUpdated();
  save();
  toast(back ? '已回到今日改动前的数值' : `已更新为 ${fmtNum(v)} ${unitOf(m)}`);
}
/** 记录「今天第一次改动前」的快照，同一天只存最早那份（数值 + 当时的上次更新时间） */
function markDay(item) {
  const today = todayStr();
  if (item.day && item.day.date === today) return;
  item.day = {
    date: today,
    at: Date.now(),
    updatedAt: Number(item.updatedAt) || 0,
    values: item.metrics.map(x => ({ id: x.id, value: x.value, updatedAt: Number(x.updatedAt) || 0 }))
  };
}
const touchedToday = item => !!(item.day && item.day.date === todayStr());

/** 数值已经回到「今日改动前」时，把今日标记与撤销记录一起清掉（小红点随之消失），时间也回到改动前 */
function syncDayFlag(item) {
  if (!item.day) return true;
  const same = item.day.values.every(v => {
    const m = item.metrics.find(x => x.id === v.id);
    return !m || Number(m.value || 0) === Number(v.value || 0);
  });
  if (same) {
    item.metrics.forEach(m => {
      const v = item.day.values.find(x => x.id === m.id);
      if (v) m.updatedAt = Number(v.updatedAt) || 0;
    });
    item.updatedAt = Number(item.day.updatedAt) || 0;
    item.day = null;
    item.undo = [];
  }
  return same;
}


/** 一键回到今天第一次改动之前的状态（数值和上次更新时间一起回去） */
function restoreDay(item) {
  if (!touchedToday(item)) return;
  const snap = item.day;
  snap.values.forEach(v => {
    const m = item.metrics.find(x => x.id === v.id);
    if (m) { m.value = v.value; m.updatedAt = Number(v.updatedAt) || 0; }
  });
  item.updatedAt = Number(snap.updatedAt) || 0;
  item.day = null;
  item.undo = [];          // 今日快照已回退，之前的步骤记录也失效
  markUpdated();
  save();
  toast('已恢复到今日更新前的数据');
}

/**
 * +1 / -1 累加。2 秒内的连续点击合并成一条撤销记录，
 * 免得点十下要撤销十次。
 */
function bumpValue(item, metricId, delta) {
  const m = item.metrics.find(x => x.id === metricId);
  if (!m || m.kind === 'days') return;
  const cur = Number(m.value) || 0;
  const next = Math.max(0, cur + delta);
  if (next === cur) { toast('已经是 0 了'); return; }

  markDay(item);
  const now = Date.now();
  item.undo = item.undo || [];
  const last = item.undo[item.undo.length - 1];
  const merge = last && last.mid === metricId && now - last.at < 2000;
  if (merge) {
    last.at = now;
  } else {
    item.undo.push({ at: now, mid: metricId, updatedAt: Number(item.updatedAt) || 0, values: item.metrics.map(x => ({ id: x.id, value: x.value, updatedAt: Number(x.updatedAt) || 0 })) });
    if (item.undo.length > 30) item.undo.shift();
  }
  m.value = next;
  m.updatedAt = now;
  touchItem(item);
  syncDayFlag(item);
  markUpdated();
  save();
}

function undoItem(item) {
  const snap = (item.undo || []).pop();
  if (!snap) return;
  snap.values.forEach(v => {
    const m = item.metrics.find(x => x.id === v.id);
    if (m) { m.value = v.value; m.updatedAt = Number(v.updatedAt) || 0; }
  });
  item.updatedAt = Number(snap.updatedAt) || 0;
  // 如果已经退回到今天改动之前，今日标记也一并清掉（时间回到改动前）
  const back = syncDayFlag(item);
  markUpdated();
  save();
  toast(back ? '已回到今日改动前的数值' : '已撤销上一次更新');
}

/* ---------------- 渲染 ---------------- */
function visibleItems() {
  let list = state.items.slice();
  const kinds = i => (i.metrics || []).map(m => m.kind);
  if (state.filter === 'days') list = list.filter(i => kinds(i).includes('days'));
  if (state.filter === 'manual') list = list.filter(i => kinds(i).some(k => k !== 'days'));
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    list = list.filter(i => i.name.toLowerCase().includes(q));
  }
  const asc = state.dir === 'asc';
  switch (state.sort) {
    case 'cost':
      list.sort((a, b) => {
        const d = (metricCost(b, displayMetric(b)) ?? -1) - (metricCost(a, displayMetric(a)) ?? -1);
        return asc ? -d : d;
      });
      break;
    case 'recent':
      list.sort((a, b) => {
        const d = String(b.buyDate).localeCompare(String(a.buyDate));
        return asc ? -d : d;
      });
      break;
    case 'added':
      list.sort((a, b) => asc
        ? (a.createdAt || 0) - (b.createdAt || 0)
        : (b.createdAt || 0) - (a.createdAt || 0));
      break;
    case 'price':
      list.sort((a, b) => asc ? a.price - b.price : b.price - a.price);
      break;
    case 'name':
      list.sort((a, b) => {
        const d = a.name.localeCompare(b.name, 'zh-CN');
        return asc ? -d : d;
      });
      break;
    case 'custom':
      break;   // 保持 state.items 的数组顺序（拖拽结果）
  }
  return list;
}

/**
 * 折线图的统一刻度：所有物品共用一套坐标，图与图之间才可比
 * 纵轴按对数取「单件日均成本」的全局范围（贵的起点高），横轴按全局最长使用天数取长度
 */
function sparkScale(list) {
  let maxPrice = 1, minCost = Infinity, maxDays = 1;
  for (const it of list) {
    const p = Number(it.price) || 0;
    if (p <= 0) continue;
    const d = useDays(it.buyDate);
    maxPrice = Math.max(maxPrice, p);
    minCost = Math.min(minCost, p / Math.max(1, d));
    maxDays = Math.max(maxDays, d);
  }
  if (!isFinite(minCost) || minCost <= 0) minCost = 1;
  const lo = Math.log10(Math.max(0.01, minCost * 0.85));
  let hi = Math.log10(Math.max(maxPrice, minCost * 2));
  if (hi - lo < 0.3) hi = lo + 0.3;
  return { lo, hi, maxDays: Math.max(1, maxDays) };
}

function sparkSvg(item, scale) {
  const days = useDays(item.buyDate);
  const sc = scale || sparkScale([item]);
  const price = Number(item.price) || 0;
  const span = Math.max(1e-9, sc.hi - sc.lo);
  const N = 44;
  // 横轴：用得越久线越长，刚买不久的只有短短一段
  const xEnd = Math.max(0.42, Math.min(1, days / sc.maxDays));
  const coords = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const d = 1 + t * (days - 1);
    const c = price / Math.max(1, d);
    const x = t * xEnd * 100;
    const y = 30 - ((Math.log10(Math.max(1e-3, c)) - sc.lo) / span) * 25;
    coords.push(`${x.toFixed(2)},${Math.max(4, Math.min(30, y)).toFixed(2)}`);
  }
  const endX = (xEnd * 100).toFixed(2);
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
    <line class="axis" x1="0" y1="30" x2="100" y2="30" vector-effect="non-scaling-stroke"/>
    <polygon class="fill" points="0,33 ${coords.join(' ')} ${endX},33"/>
    <polyline points="${coords.join(' ')}" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function metricsRowsHtml(item) {
  return item.metrics.map(mm => {

    // 按天：全自动，只读
    if (mm.kind === 'days') {
      return `<div class="m-row" data-mid="${mm.id}">
        <span class="m-label">${esc(mm.label || '按天')}</span>
        <span class="m-cost"><b>¥${fmtMoney(c)}</b>/${esc(unit)}</span>
        <span class="m-sub">${v} 天</span>
        <span class="m-tag">自动</span>
      </div>`;
    }

    // 按次数：+1 / -1 步进累加
    if (mm.kind === 'times') {
      return `<div class="m-row col" data-mid="${mm.id}">
        <div class="m-line">
          <span class="m-label">${esc(mm.label || '按次数')}</span>
          <span class="m-cost"><b>¥${fmtMoney(c)}</b>/${esc(unit)}</span>
          ${undoBtn}
        </div>
        <div class="m-line">
          <button class="step" data-act="step" data-id="${item.id}" data-mid="${mm.id}" data-delta="-1" title="减一次">−1</button>
          <input class="m-edit wide" type="text" inputmode="none" data-num autocomplete="off" value="${v}" data-mid="${mm.id}" aria-label="累计次数">
          <span class="m-unit">${esc(unit)}</span>
          <button class="step" data-act="step" data-id="${item.id}" data-mid="${mm.id}" data-delta="1" title="记一次">+1</button>
        </div>
      </div>`;
    }

    // 里程 / 自定义：直接改数值
    return `<div class="m-row col" data-mid="${mm.id}">
      <div class="m-line">
        <span class="m-label">${esc(mm.label || '按用量')}</span>
        <span class="m-cost"><b>¥${fmtMoney(c)}</b>/${esc(unit)}</span>
        ${undoBtn}
      </div>
      <div class="m-line">
        <span class="m-unit">累计</span>
        <input class="m-edit wide" type="text" inputmode="none" data-num autocomplete="off" value="${v}" data-mid="${mm.id}" aria-label="累计用量">
        <span class="m-unit">${esc(unit)}</span>
        <span class="m-sub">${daysAgoText(mm.updatedAt)}</span>
      </div>
    </div>`;
  }).join('');
}

function render() {
  const grid = $('#grid');
  const list = visibleItems();
  const compact = state.view === 'compact';
  grid.classList.toggle('compact', compact);
  const sparkSc = compact ? null : sparkScale(list);
  grid.innerHTML = compact
    ? list.map(compactHtml).join('')
    : list.map(i => cardHtml(i, sparkSc)).join('');

  // 空状态：一件都没记  vs  筛选/搜索后没有匹配
  const noItems = state.items.length === 0;
  const noMatch = !noItems && list.length === 0;
  $('#empty').hidden = !noItems;
  $('#emptyFilter').hidden = !noMatch;
  if (noMatch) {
    const q = state.q.trim();
    if (q) {
      $('#efTitle').textContent = '没有找到匹配的物品';
      $('#efDesc').textContent = `没有名称包含「${q}」的物品，换个关键词试试。`;
    } else if (state.filter === 'days') {
      $('#efTitle').textContent = '还没有按天计算的物品';
      $('#efDesc').textContent = '在物品里加一种「按天」算法，它就会出现在这里。';
    } else {
      $('#efTitle').textContent = '还没有按用量计算的物品';
      $('#efDesc').textContent = '按次数、按里程、按瓶…这些「按用量」的算法加进来就会出现在这里。';
    }
  }
  $('#viewCard').classList.toggle('on', !compact);
  $('#viewList').classList.toggle('on', compact);

  // 排序方向按钮
  const isCustom = state.sort === 'custom';
  const dirBtn = $('#dirBtn');
  dirBtn.classList.toggle('disabled', isCustom);
  dirBtn.classList.toggle('asc', state.dir === 'asc');
  $('#dirLabel').textContent = DIR_LABELS[state.sort]?.[state.dir] || '';

  // 概览
  const total = state.items.reduce((s, i) => s + (Number(i.price) || 0), 0);
  const daily = state.items.reduce((s, i) => {
    const d = i.metrics.find(m => m.kind === 'days');
    return d ? s + i.price / useDays(i.buyDate) : s;
  }, 0);
  $('#statCount').textContent = state.items.length;
  $('#statTotal').textContent = fmtNum(Math.round(total));
  $('#statDaily').textContent = daily ? fmtMoney(daily) : '0';
  const priciest = state.items.length
    ? state.items.reduce((a, b) => (Number(b.price) || 0) > (Number(a.price) || 0) ? b : a)
    : null;
  $('#statTopPrice').textContent = priciest ? fmtNum(Math.round(priciest.price)) : '0';
  $('#statTopName').textContent = priciest ? priciest.name : '暂无';
  renderStatPanel();

  hydrateImages();
}

/* ---------------- 概览卡片：点击展开明细 ---------------- */
const STAT_TITLES = { items: '全部物品', cost: '按价格从高到低', top: '价格排行 · 前 5' };

function statThumb(item) {
  const cached = item.imgKey ? urlCache.get(item.imgKey) : null;

    ? `<img ${cached ? `src="${cached}"` : `data-img="${esc(item.imgKey)}"`} alt="">`

function statBody(kind) {
  const items = state.items;
  if (!items.length) return `<p class="sp-empty">还没有物品，先点右上角「添加物品」记一件吧。</p>`;

  if (kind === 'cost') {

    return `<div class="sp-list">${list.map(it => `
      <div class="sp-row">

        <em>¥${fmtMoney(Number(it.price) || 0)}</em>

  }

  // top：价格前 5
  const total = items.reduce((s, i) => s + (Number(i.price) || 0), 0) || 1;
  const list = [...items].sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0)).slice(0, 5);

/* ---------------- 拖拽排序（触屏 + 鼠标） ---------------- */
(() => {
  const grid = $('#grid');
  let drag = null;          // { el, id, ph, dx, dy, ti }
  let lastDragEnd = 0;
  const running = new WeakMap();   // 每个节点正在播放的位移动画

  /** FLIP：让一组节点从「旧位置」平滑滑到「新位置」 */
  function slide(nodes, before) {
    for (const n of nodes) {
      const b = before.get(n);
      if (!b) continue;
      const a = n.getBoundingClientRect();
      const dx = b.left - a.left;
      const dy = b.top - a.top;
      if (Math.abs(dx) < .5 && Math.abs(dy) < .5) continue;
      const old = running.get(n);
      if (old) old.cancel();
      const anim = n.animate(
        [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0px, 0px)' }],
        { duration: 240, easing: 'cubic-bezier(.22,.86,.3,1)' }
      );
      running.set(n, anim);
    }
  }

  /** 把占位槽移动到第 ti 个位置，其余卡片跟着上移 / 下移 */
  function slotTo(ti) {
    const { el, ph } = drag;
    const flow = [...grid.children].filter(c => c !== el);   // 在流中的节点（含占位槽）
    if (flow.indexOf(ph) === ti) return;                     // 位置没变，不用动
    const others = flow.filter(c => c !== ph);
    const ref = others[ti] || null;
    const before = new Map(flow.map(n => [n, n.getBoundingClientRect()]));
    if (ref) grid.insertBefore(ph, ref);
    else grid.appendChild(ph);
    slide(flow, before);
    drag.ti = ti;
  }

  /* --- 拖到屏幕上 / 下边缘时自动滚动页面 --- */
  let autoScroll = null;   // { id, speed }
  function stopAutoScroll() {
    if (autoScroll) { cancelAnimationFrame(autoScroll.id); autoScroll = null; }
  }
  function autoScrollStep(now) {
    if (!drag) { stopAutoScroll(); return; }
    const last = autoScroll.last || now;
    autoScroll.last = now;
    window.scrollBy(0, autoScroll.speed * (now - last) / 16);
    if (grid.contains(drag.el)) updateDrag(drag.cx, drag.cy);   // 滚动后重新判断落点
    autoScroll.id = requestAnimationFrame(autoScrollStep);
  }
  function setAutoScroll(clientY) {
    if (!drag) return;
    const margin = 96, max = 26;
    const vh = window.innerHeight;
    let speed = 0;
    if (clientY > vh - margin) speed = Math.min(max, (clientY - (vh - margin)) / margin * max + 5);
    else if (clientY < margin && window.scrollY > 0) speed = -Math.min(max, (margin - clientY) / margin * max + 5);
    if (!speed) { stopAutoScroll(); return; }
    if (autoScroll) { autoScroll.speed = speed; return; }       // 已在滚，只调速度
    autoScroll = { id: requestAnimationFrame(autoScrollStep), speed, last: 0 };
  }

  /** 卡片跟随指针 + 重算插入位置（指针移动与自动滚动共用） */
  function updateDrag(cx, cy) {
    if (!drag || !grid.contains(drag.el)) return;
    drag.el.style.left = (cx - drag.dx) + 'px';
    drag.el.style.top = (cy - drag.dy) + 'px';
    // 指针位置 → 目标插入索引（其余卡片按显示顺序，不含被拖卡）
    const others = $$('#grid > [data-id]').filter(c => c !== drag.el);
    const rects = others.map(c => c.getBoundingClientRect());
    let ti = rects.length;
    for (let k = 0; k < rects.length; k++) {
      const r = rects[k];
      if (cy < r.top + r.height / 2) { ti = k; break; }
    }
    slotTo(ti);
  }

  let pending = null;        // 手柄已按下、还没真正拖动
  const THRESH = 6;          // 移动超过这么多像素才算拖拽，单纯点一下不影响顺序

  grid.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle || drag || pending) return;
    if (state.q.trim() || state.filter !== 'all') {
      toast('先清除搜索和筛选，再拖动排序', true);
      return;
    }
    // 列表视图里手柄在按钮内部，按钮也带 data-id，必须往上找到整张卡（grid 的直接子元素）
    const el = handle.closest('.card[data-id], .crow[data-id]');
    if (!el) return;
    e.preventDefault();   // 阻止触屏滚动与 click 误触发
    pending = { el, x: e.clientX, y: e.clientY };
  });

  /** 真正进入拖拽：卡片浮起跟随手指，原位留下占位槽 */
  function beginDrag(e) {
    const el = pending.el;
    pending = null;
    const rect = el.getBoundingClientRect();
    const ph = document.createElement('div');
    ph.className = 'drag-ph';
    ph.style.height = rect.height + 'px';
    el.before(ph);
    Object.assign(el.style, {
      position: 'fixed', left: rect.left + 'px', top: rect.top + 'px',
      width: rect.width + 'px', height: rect.height + 'px'
    });
    el.classList.add('dragging');
    grid.classList.add('is-dragging');
    drag = { el, id: el.dataset.id, ph, dx: e.clientX - rect.left, dy: e.clientY - rect.top, cx: e.clientX, cy: e.clientY, ti: null };
    updateDrag(e.clientX, e.clientY);
  }

  document.addEventListener('pointermove', e => {
    if (!drag) {
      if (!pending) return;
      if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) < THRESH) return;
      beginDrag(e);
      if (!drag) return;
    }
    e.preventDefault();
    // DOM 被重建（占位槽游离）时放弃本次拖拽，避免状态错乱
    if (!grid.contains(drag.ph) || !grid.contains(drag.el)) {
      const { el: dead } = drag;
      drag = null;
      stopAutoScroll();
      grid.classList.remove('is-dragging');
      dead.classList.remove('dragging');
      dead.style.cssText = '';
      dead.remove();
      render();
      return;
    }
    drag.cx = e.clientX;
    drag.cy = e.clientY;
    updateDrag(e.clientX, e.clientY);
    setAutoScroll(e.clientY);   // 靠近屏幕上 / 下边缘时自动滚动
  });

  const finish = () => {
    if (pending && !drag) {   // 只是点了一下手柄，什么都不做
      pending = null;
      lastDragEnd = Date.now();
      return;
    }
    if (!drag) return;
    const { el, ph, id } = drag;
    drag = null;
    lastDragEnd = Date.now();
    stopAutoScroll();
    grid.classList.remove('is-dragging');

    // 落点索引 = 占位槽前面还有几张卡（占位槽必须是 grid 的直接子元素才算数）
    let dropIdx = null;
    if (ph.parentElement === grid) {
      let i = 0;
      for (const c of grid.children) {
        if (c === el) continue;
        if (c === ph) break;
        i++;
      }
      dropIdx = i;
    }
    const floatRect = el.getBoundingClientRect();   // 松手瞬间的位置，用于落位动画
    ph.remove();
    el.classList.remove('dragging');
    el.style.cssText = '';
    el.remove();

    if (dropIdx == null) { render(); return; }

    // 按显示顺序重排：把被拖卡插到落点
    const shown = visibleItems();
    const from = shown.findIndex(i => i.id === id);
    if (from < 0) { render(); return; }
    const moved = dropIdx !== from;
    const item = shown.splice(from, 1)[0];
    shown.splice(Math.max(0, Math.min(shown.length, dropIdx)), 0, item);
    state.items = shown;

    if (moved && state.sort !== 'custom') {
      state.sort = 'custom';
      $('#sortSel').value = 'custom';
      toast('已保存为自定义排序');
    } else if (moved) {
      toast('顺序已更新');
    }
    markUpdated();
    save(); render();

    // 从松手的位置「飞」回自己的新位置
    const landed = grid.querySelector(`[data-id="${id}"]`);
    if (landed && moved) {
      const r = landed.getBoundingClientRect();
      landed.animate([
        { transform: `translate(${floatRect.left - r.left}px, ${floatRect.top - r.top}px) scale(1.02)`, opacity: .96 },
        { transform: 'translate(0px, 0px) scale(1)', opacity: 1 }
      ], { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1)' });
    }
  };
  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
  // 拖拽刚结束时忽略一次 click，防止误触发展开/编辑
  document.addEventListener('click', e => {
    if (drag || Date.now() - lastDragEnd < 150) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
})();

function metricFormHtml(m, isPrimary) {
  const kind = m.kind || 'days';
  const auto = kind === 'days';
  const isCustom = kind === 'custom';
  // 自定义：这个框就是「名称」本身（如 瓶 / 页 / 支），不预填「单位」免得打字接在旧字后面
  const customName = isCustom ? customNameOf(m) : '';
  const unitVal = isCustom ? customName : (m.unit || KINDS[kind].unit);
  return `<div class="metric-form" data-id="${m.id}" data-kind="${kind}">
    <select class="kind">
      ${Object.entries(KINDS).map(([k, v]) =>
        `<option value="${k}" ${k === kind ? 'selected' : ''}>${v.label}</option>`).join('')}
    </select>
    <input class="unit-in${isCustom ? ' name-in' : ''}" value="${esc(unitVal)}"
           placeholder="${isCustom ? '名称，如 瓶' : '单位'}"
           title="${isCustom ? '给这个算法起个名字，如 瓶 / 页 / 支' : '单位名称'}">
    <input class="val-in" type="text" inputmode="none" data-num autocomplete="off" value="${auto ? '' : (m.value ?? '')}"
           placeholder="${auto ? '自动' : '累计'}" ${auto ? 'disabled' : ''}>
    <label class="primary-pick" title="卡片上显示这个口径">
      <input type="radio" name="primaryMetric" ${isPrimary ? 'checked' : ''}>主显示
    </label>
    <span class="grow"></span>
    <button type="button" class="rm" title="删除">✕</button>
  </div>`;
}

/** 自定义算法里用户起的名字（去掉「按」前缀与占位的「单位」） */
function customNameOf(m) {
  const label = String(m.label || '').replace(/^按/, '').trim();
  if (label && label !== '自定义') return label;
  const unit = String(m.unit || '').trim();
  return unit && unit !== '单位' ? unit : '';
}

/** 压缩到指定长边，保持高清又不至于爆存储 */
function shrinkImage(file, maxSide, quality) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load failed')); };
    img.src = url;
  });
}

  const name = $('#fName').value.trim();
  const price = Number($('#fPrice').value);
  const buyDate = $('#fDate').value;

  if (!name) return toast('给物品起个名字吧', true);
  if (!isFinite(price) || price <= 0) return toast('价格要填一个大于 0 的数字', true);
  if (!buyDate) return toast('选一下购买日期', true);
  if (buyDate > todayStr()) return toast('购买日期不能是未来', true);

  const rows = $$('#metricRows .metric-form');
  if (!rows.length) return toast('至少添加一种计算方式', true);

  const metrics = [];
  let primaryId = null;
  for (const row of rows) {
    const kind = $('.kind', row).value;
    const rawUnit = $('.unit-in', row).value.trim();
    const id = row.dataset.id || uid();
    let unit, label;
    if (kind === 'custom') {
      // 自定义：用户填的名字既是「按 X」的标签，也是单价单位
      const nm = rawUnit.replace(/^按/, '').trim();
      if (!nm) {
        $('.unit-in', row).classList.add('need-name');
        $('.unit-in', row).focus?.();
        return toast('给这个自定义算法起个名字吧，比如「瓶」「页」「支」', true);
      }
      if (nm.length > 8) return toast('名字短一点更好看，8 个字以内', true);
      unit = nm;
      label = '按' + nm;
    } else {
      unit = rawUnit || KINDS[kind].unit;
      label = KINDS[kind].label;
    }
    const m = { id, kind, unit, label };
    if (kind !== 'days') {
      const v = Number($('.val-in', row).value);
      if (!isFinite(v) || v < 0) return toast('累计用量要填 0 或正数', true);
      m.value = v;
      m.updatedAt = Date.now();
    }
    if ($('input[type=radio]', row).checked) primaryId = id;
    metrics.push(m);
  }
  if (!primaryId) primaryId = metrics[0].id;

  const id = editingId || uid();
  const old = state.items.find(i => i.id === id);

  // 在编辑弹窗里改了累计数值，同样算「今日更新过」，也要能一键恢复
  if (old) {
    const changed = metrics.some(m => {
      const om = (old.metrics || []).find(x => x.id === m.id);
      return om && m.kind !== 'days' && Number(om.value || 0) !== Number(m.value || 0);
    });
    if (changed) markDay(old);
  }

  const item = {
    id, name, price, buyDate,
    emoji: old?.emoji || pendingEmoji,
    imgKey: old?.imgKey || null,
    metrics, primaryId,
    undo: old?.undo || [],
    day: old?.day || null,
    createdAt: old?.createdAt || Date.now(),
    updatedAt: Date.now()
  };

  if (pendingBlob) {
    const key = `img-${id}`;
    try { await imgPut(key, pendingBlob); } catch (e) { /* ignore */ }
    if (item.imgKey && item.imgKey !== key) imgDel(item.imgKey);
    if (item.imgKey) urlCache.delete(item.imgKey);
    item.imgKey = key;
  }
  if (!pendingBlob && old?.imgKey === null) item.imgKey = null;

  if (old) state.items = state.items.map(i => (i.id === id ? item : i));
  else state.items.unshift(item);

  markUpdated();
  save();
  closeModal('#itemModal');
  render();
  toast(old ? '已保存修改' : '已添加，看看它每天多少钱');
});

/* ---------------- 自动备份 ---------------- */
const BAK_KEY = 'yiwu.backups';
const BAK_MAX = 20;

/** 浏览器内自动快照：内容没变不重复存 */
function pushSnapshot() {
  let snaps = [];
  try { snaps = JSON.parse(localStorage.getItem(BAK_KEY)) || []; } catch (e) { /* ignore */ }
  const cur = JSON.stringify({ items: state.items, bg: state.bg });
  if (snaps.length && snaps[0].data === cur) return;   // 没变化
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  snaps.unshift({
    at: Date.now(),
    label: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
    count: state.items.length,
    data: cur
  });
  if (snaps.length > BAK_MAX) snaps.length = BAK_MAX;
  try { localStorage.setItem(BAK_KEY, JSON.stringify(snaps)); } catch (e) { /* 空间不足时静默放弃 */ }
}

function renderBackupList() {
  let snaps = [];
  try { snaps = JSON.parse(localStorage.getItem(BAK_KEY)) || []; } catch (e) { /* ignore */ }
  const el = $('#backupList');
  if (!snaps.length) {
    el.innerHTML = '<p class="note">还没有快照，改动一次数据后就会出现。</p>';
    return;
  }
  el.innerHTML = snaps.map((s, i) => `
    <div class="bak-item">
      <span class="bak-time">${esc(s.label)}</span>
      <span class="bak-count">${s.count} 件</span>
      <button class="m-act" data-bak="${i}">恢复</button>
    </div>`).join('');
}
$('#backupList').addEventListener('click', e => {
  const btn = e.target.closest('[data-bak]');
  if (!btn) return;
  let snaps = [];
  try { snaps = JSON.parse(localStorage.getItem(BAK_KEY)) || []; } catch (err) { return; }
  const s = snaps[Number(btn.dataset.bak)];
  if (!s) return;
  if (!confirm(`恢复到 ${s.label} 的快照？当前数据会被覆盖。`)) return;
  try {
    const d = JSON.parse(s.data);
    state.items = Array.isArray(d.items) ? d.items : state.items;
    state.items.forEach(i => { if (!Number(i.updatedAt)) i.updatedAt = Date.now(); });
    if (d.bg) state.bg = { ...state.bg, ...d.bg };
    markUpdated();
    save(); applyBg(); render();
    toast('已恢复快照');
  } catch (err) { toast('快照损坏，无法恢复', true); }
});

/* --- 自动保存 JSON 文件 --- */
let fileHandle = null;   // File System Access API 句柄（桌面 Chrome/Edge）
const canPickFile = typeof window.showSaveFilePicker === 'function';

function scheduleFileBackup() {
  if (!state.autobak?.file) return;
  clearTimeout(scheduleFileBackup.t);
  scheduleFileBackup.t = setTimeout(runFileBackup, 3000);
}
async function runFileBackup() {
  if (!state.autobak?.file) return;
  // 物品和背景没变化就不重复保存（搜索、排序等偏好变化不算）
  const sig = JSON.stringify({ items: state.items, bg: state.bg });
  if (sig === runFileBackup.last) return;
  runFileBackup.last = sig;
  const payload = JSON.stringify(state, null, 2);
  if (fileHandle) {
    try {
      if ((await fileHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
        $('#autoBakNote').textContent = '⚠️ 浏览器要求重新授权保存位置，打开备份设置点一次「选择保存位置」即可。';
        return;
      }
      const w = await fileHandle.createWritable();
      await w.write(payload);
      await w.close();
      $('#autoBakNote').textContent = `上次自动保存：${new Date().toLocaleTimeString('zh-CN')}`;
    } catch (err) {
      $('#autoBakNote').textContent = '⚠️ 自动保存失败：' + err.message;
    }
    return;
  }
  // 回退：自动下载一份（iOS Safari / 其他不支持选固定位置的浏览器）
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const name = `一物一价自动备份-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  try {
    const blob = new Blob([payload], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    $('#autoBakNote').textContent = `已下载 ${name}，在「文件」App 的下载文件夹里。`;
  } catch (err) { /* ignore */ }
}

      : '已开启。此浏览器不支持固定保存位置，将改为每次编辑后自动下载一份 JSON（iPhone 会存到「文件」App）。';

});
