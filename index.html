/* ---------------- 数字键盘：触摸设备上替代系统键盘 ---------------- */
(() => {
  const pad = $('#numKbd');
  const grid = $('#nkGrid');
  const valEl = $('#nkVal');
  const titleEl = $('#nkTitle');
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  const DIGIT_SEL = 'input[data-num]';
  let target = null;
  let orig = '';
  let fresh = false;           // 刚打开键盘、还没敲过键

  function sync() {
    if (target) valEl.textContent = target.value || '0';
  }

  function open(inp) {
    target = inp;
    orig = inp.value;
    fresh = true;
    inp.classList.add('num-in-active');
    titleEl.textContent = inp.getAttribute('aria-label') || '输入数字';
    sync();
    pad.classList.add('show');
    pad.setAttribute('aria-hidden', 'false');
    document.body.classList.add('kbd-open');
    // 让弹窗/页面给键盘腾地方，并把输入框露在键盘上方
    if (window.syncKbdLayout) window.syncKbdLayout();
    requestAnimationFrame(() => { if (window.syncKbdLayout) window.syncKbdLayout(); });
  }

  function close(commit = true) {
    if (!target) return;
    const inp = target;
    target = null;
    inp.classList.remove('num-in-active');
    pad.classList.remove('show');
    pad.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('kbd-open');
    if (window.syncKbdLayout) window.syncKbdLayout();
    const v = inp.value.trim();
    if (v === '' || v === '.' || isNaN(Number(v))) inp.value = '';
    if (commit && inp.value !== orig && inp.isConnected) {
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }

  function type(ch) {
    if (!target) return;
    let v = target.value;
    if (ch === 'back') {
      target.value = v.slice(0, -1);
      fresh = false;
      sync();
      return;
    }
    if (fresh) {                 // 刚点开：第一个数字直接替换旧值（像全选重输）
      if (ch === '.') return;
      v = '';
      fresh = false;
    } else if (ch === '.') {
      if (v.includes('.')) return;
      if (v === '') v = '0';
    } else if (v === '0') {
      v = '';
    }
    if (v.includes('.')) {
      if ((v.split('.')[1] || '').length >= 2) return;   // 最多两位小数
    } else if (v.replace('.', '').length >= 9) return;
    target.value = v + ch;
    sync();
  }

  grid.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    e.preventDefault();
    type(b.dataset.k);
  });
  $('#nkDone').addEventListener('pointerdown', e => { e.preventDefault(); close(true); });

  if (isTouch) {
    // 点数字框 → 自定义键盘接管（放在 click 阶段，避免布局变化打断本次点击）
    document.addEventListener('click', e => {
      const inp = e.target.closest(DIGIT_SEL);
      if (!inp || inp.disabled) return;
      if (target === inp) return;
      if (target) close(true);
      open(inp);
    }, true);
    // 点到别处：延后一拍再收起，不影响这一次点击（删除 / 保存之类）
    document.addEventListener('pointerdown', e => {
      if (!target) return;
      if (pad.contains(e.target) || e.target.closest(DIGIT_SEL)) return;
      const t = target;
      setTimeout(() => { if (target === t) close(true); }, 0);
    }, true);
  }

  window.closeNumKbd = () => close(true);
})();

/* ---------------- 键盘避让：系统键盘 / 自定义数字键盘 ---------------- */
/* 目标：不管弹出哪种键盘，正在编辑的输入框始终完整露在键盘上方 */
(() => {
  const root = document.documentElement;
  const vv = window.visualViewport;
  let activeEl = null;        // 正在编辑的输入框
  let baseH = window.innerHeight;   // 无键盘时的视口高度（给 Android 用）
  let lastH = -1;
  let rafId = 0;

  const padOpen = () => {
    const pad = $('#numKbd');
    return pad && pad.classList.contains('show') ? pad.getBoundingClientRect().height : 0;
  };

  /** 当前键盘占据的高度 */
  function kbdHeight() {
    const p = padOpen();
    if (p > 0) return Math.round(p);
    if (!vv) return Math.max(0, Math.round(baseH - window.innerHeight));
    // iOS：内层视口变矮（可能还叠加页面被顶起）；Android：innerHeight 直接变矮 —— 取两者较大
    const byVV = window.innerHeight - (vv.height + vv.offsetTop);
    const byInner = baseH - window.innerHeight;
    const h = Math.max(byVV, byInner);
    return h > 80 ? Math.round(h) : 0;
  }

  function apply(h) {
    if (h === lastH) return;
    lastH = h;
    root.style.setProperty('--kbd-h', h + 'px');
    document.body.classList.toggle('kbd-active', h > 40);
  }

  /** 输入框最近的可滚动祖先（没有就用整页） */
  function scrollerOf(el) {
    let n = el.parentElement;
    while (n && n !== document.body && n !== document.documentElement) {
      const oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 2) return n;
      n = n.parentElement;
    }
    return null;
  }

  /** 把输入框挪进「键盘上沿以上」的可见区 */
  function reveal(el) {
    if (!el || !el.isConnected) return;
    const h = kbdHeight();
    if (!h) return;
    const r = el.getBoundingClientRect();
    const kbTop = window.innerHeight - h - 22;      // 键盘上沿再留点空
    const sc = scrollerOf(el);
    const boxTop = sc ? Math.max(sc.getBoundingClientRect().top + 8, 6) : 8;
    const boxBottom = Math.min(sc ? sc.getBoundingClientRect().bottom - 8 : kbTop, kbTop);
    if (boxBottom <= boxTop) return;                // 可视区太小，交给布局收缩
    let dy = 0;
    if (r.bottom > boxBottom) dy = r.bottom - boxBottom;
    else if (r.top < boxTop) dy = r.top - boxTop;
    if (!dy) return;
    const opts = { top: Math.round(dy), behavior: 'smooth' };
    if (sc) sc.scrollBy(opts); else window.scrollBy(opts);
  }

  function sync() {
    const h = kbdHeight();
    apply(h);
    // 弹窗刚收缩，等一帧再量位置
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => reveal(activeEl));
    // 键盘收起后校正基准高度
    const ae = document.activeElement;
    const editing = ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName);
    if (h === 0 && !editing) baseH = window.innerHeight;
  }
  window.syncKbdLayout = sync;

  document.addEventListener('focusin', e => {
    const el = e.target;
    if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    activeEl = el;
    // 键盘有弹出动画，分几拍校正位置
    [60, 180, 360, 620].forEach(t => setTimeout(sync, t));
  });
  document.addEventListener('focusout', e => {
    if (e.target !== activeEl) return;
    setTimeout(() => {
      const a = document.activeElement;
      if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { activeEl = null; sync(); }
    }, 70);
  });

  if (vv) {
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', () => setTimeout(sync, 320));
})();

/* ---------------- 启动 ---------------- */
function boot() {
  const had = load();
  initBgPanel();
  applyBg();
  $('#sortSel').value = state.sort;
  $('#search').value = state.q;
  $$('#filterChips .chip').forEach(c => c.classList.toggle('on', c.dataset.filter === state.filter));
  if (!had) state.items = [];   // 首次打开是空的，示例需手动载入
  render();
}
boot();

})();

</script>
</body>
